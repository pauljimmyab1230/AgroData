name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck -w @agrodata/api

      - name: Typecheck Web
        run: npm run typecheck -w @agrodata/web

      - name: Typecheck Mobile
        run: npm run typecheck -w @agrodata/mobile

      - name: Tests
        run: npm test

      - name: Build Web
        run: npm run build -w @agrodata/web

  prisma-drift:
    runs-on: ubuntu-latest
    needs: verificar

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: agrodata_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sincronización de migraciones
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/agrodata_test
        run: npx prisma migrate diff --from-schema-datasource packages/database/prisma/schema.prisma --to-migrations packages/database/prisma/migrations --shadow-database-url mysql://root:test@localhost:3306/agrodata_shadow --exit-code
        working-directory: .
